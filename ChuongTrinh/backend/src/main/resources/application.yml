server:
  port: 8080

spring:
  application:
    name: smart-campus-parking
  datasource:
    url: jdbc:mariadb://localhost:3307/parking_db?useUnicode=true&characterEncoding=utf8mb4
    username: parking_user
    password: parking_password
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration